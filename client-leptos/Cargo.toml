[package]
name = "rust-berlin-leptos"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
reactive_stores = { version = "0.4.4" }
thaw = { version = "0.5.0-beta", features = ["csr"] }
uuid = { version = "1.28.0", features = ["v4"] }

graphql_client = "0.16.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures = "0.3.34"
ws_stream_wasm = "0.7.5"
wasm-bindgen-futures = "0.4.79"
wasm-bindgen = "0.2.129"
serde_derive = "1.0.229"

# KeyCloak authentication
keycloak-wasm-auth = { git = "https://github.com/oxide-byte/keycloak-wasm-auth" }